# Redis Configuration File
# This file is version controlled. Update password in .env to match.

# Network
bind 0.0.0.0
port 6379
protected-mode yes

# Security - Password should match REDIS_PASSWORD in .env
requirepass your_strong_redis_password_here

# Rename dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command KEYS ""
rename-command SHUTDOWN ""
rename-command DEBUG ""
rename-command MODULE ""

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence - Backup to disk
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfsync everysec
dir /data

# Logging
loglevel notice
logfile /data/redis.log

# Client
timeout 300
tcp-keepalive 300
maxclients 10000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128