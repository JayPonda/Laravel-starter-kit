<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Edit File - Laravel Boilerplate</title>
    <link rel="stylesheet" href="styleguild.css">
    <style>
        .flex-main {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
        }

        .editor-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
            background: #272822;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }

        .editor-toolbar {
            height: 54px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem;
            border-bottom: 1px solid #ddd;
            flex-shrink: 0;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .file-name {
            color: #1c1e21;
            font-weight: 600;
            font-size: 14px;
        }

        .file-mode {
            font-size: 10px;
            padding: 2px 6px;
            margin-bottom: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #editor-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #editor {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
        }

        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="loading-screen" class="loading-screen">Loading editor...</div>

    <div id="content" class="hidden">
        <nav class="navbar">
            <a href="dashboard.html" class="navbar-brand">Laravel Boilerplate</a>
            <div class="user-nav">
                <a href="files.html" class="logout-link">My Files</a>
                <span id="nav-user-name" class="user-name"></span>
                <span class="logout-link" onclick="logout()">Logout</span>
            </div>
        </nav>

        <div class="main-container flex-main">
            <div class="editor-wrapper">
                <div class="editor-toolbar">
                    <div class="flex-center gap-4">
                        <a href="files.html" class="btn btn-secondary btn-small">← Exit</a>
                        <div class="file-info">
                            <span id="display-file-name" class="file-name">file_name.ext</span>
                            <span id="display-file-mode" class="file-mode status-badge status-loading">TEXT</span>
                        </div>
                    </div>
                    <div class="flex-center gap-2">
                        <span id="saveStatus" class="text-small mr-2" style="color: #888;"></span>
                        <button type="button" class="btn btn-primary" onclick="saveFile()">
                            Save Changes
                        </button>
                    </div>
                </div>

                <div id="editor-container">
                    <div id="editor"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ext-language_tools.min.js"></script>
    <script src="constants.js"></script>
    <script>
        async function validateAuth() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'login.html'; return false; }
            try {
                const res = await fetch(`${CONFIG.API_URL}/me`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
                });
                if (!res.ok) { localStorage.removeItem('token'); window.location.href = 'login.html'; return false; }
            } catch { localStorage.removeItem('token'); window.location.href = 'login.html'; return false; }
            return true;
        }

        window.addEventListener('pageshow', async function(e) {
            if (e.persisted || !document.getElementById('content').classList.contains('hidden')) {
                const valid = await validateAuth();
                if (!valid) return;
            }
        });

        const token = localStorage.getItem('token');
        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id');

        if (!token) window.location.href = 'login.html';
        if (!fileId) window.location.href = 'files.html';

        // Configure Ace
        ace.config.set('basePath', 'https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/');
        const editor = ace.edit("editor");
        editor.setTheme("ace/theme/monokai");
        editor.getSession().setUseWorker(false);
        editor.setShowPrintMargin(false);
        editor.setFontSize(14);
        editor.setOptions({
            enableBasicAutocompletion: true,
            enableLiveAutocompletion: true,
            useSoftTabs: true,
            tabSize: 4
        });

        async function init() {
            try {
                // Get user info
                const userRes = await fetch(`${CONFIG.API_URL}/me`, { 
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } 
                });
                if (!userRes.ok) throw new Error('Unauthorized');
                const user = await userRes.json();
                document.getElementById('nav-user-name').textContent = user.name;

                // Get file info and content
                const fileRes = await fetch(`${CONFIG.API_URL}/files/${fileId}`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
                });
                if (!fileRes.ok) throw new Error('File not found');
                
                // We need the file details (meta) and the content
                // Based on standard Laravel API resource, data might be nested
                const fileData = await fileRes.json();
                const file = fileData.data || fileData;

                // Set metadata
                document.getElementById('display-file-name').textContent = file.original_name;
                const extension = file.original_name.split('.').pop().toLowerCase();
                const mode = getModeFromExtension(extension);
                document.getElementById('display-file-mode').textContent = mode.toUpperCase();
                editor.getSession().setMode(`ace/mode/${mode}`);

                // Load content
                // The API /files/{id} probably returns file meta, we might need a separate way to get content
                // Or maybe the API returns content for specific extensions
                // Let's assume the API returns content in the file object for now
                if (file.content !== undefined) {
                    editor.setValue(file.content, -1);
                } else {
                    // If content isn't in meta, we might need to fetch the actual file blob
                    const blobRes = await fetch(`${CONFIG.API_URL}/files/${fileId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const content = await blobRes.text();
                    editor.setValue(content, -1);
                }

                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                editor.resize();

            } catch (err) {
                console.error(err);
                alert('Failed to load file for editing');
                window.location.href = 'files.html';
            }
        }

        async function saveFile() {
            const status = document.getElementById('saveStatus');
            status.textContent = 'Saving...';
            
            try {
                const res = await fetch(`${CONFIG.API_URL}/files/${fileId}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${token}`, 
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content: editor.getValue() })
                });

                if (res.ok) {
                    status.textContent = 'Saved successfully!';
                    setTimeout(() => status.textContent = '', 3000);
                } else {
                    const error = await res.json();
                    alert(error.message || 'Save failed');
                    status.textContent = 'Save failed';
                }
            } catch (err) {
                alert('An error occurred during save');
                status.textContent = 'Error';
            }
        }

        function getModeFromExtension(ext) {
            const map = {
                'js': 'javascript', 'ts': 'typescript', 'jsx': 'jsx', 'tsx': 'tsx',
                'py': 'python', 'rb': 'ruby', 'php': 'php', 'java': 'java',
                'c': 'c_cpp', 'cpp': 'c_cpp', 'h': 'c_cpp', 'cs': 'csharp',
                'go': 'golang', 'rs': 'rust', 'html': 'html', 'css': 'css',
                'json': 'json', 'xml': 'xml', 'yaml': 'yaml', 'yml': 'yaml',
                'md': 'markdown', 'sql': 'sql', 'sh': 'sh'
            };
            return map[ext] || 'text';
        }

        async function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        window.addEventListener('resize', () => editor.resize());

        init();
    </script>
</body>
</html>
